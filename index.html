        <div class="noscript">
        <article class="card"><p class="kicker">the maker</p><h3>I'm Henry.</h3><p>Fourteen, from Austin, and a proud vibecoder. I build voice AI, robots, a submarine, and a company. Right now I work at Crawft, and I founded SiteLight.</p> <a class="act" href="https://github.com/henrybrewer00-dotcom">GitHub ↗</a> <a class="act" href="mailto:henrybrewer00@gmail.com?subject=You're%20hired&amp;body=Hi%20Henry%2C%0A%0AHere's%20what%20I'd%20love%20to%20build%20with%20you%3A%0A%0A">Email →</a></article>
        <article class="card"><p class="kicker">current job</p><h3>Crawft</h3><p>Where I work right now, since mid-August 2026. Crawft is an AI-powered monitoring tool for schools and managers: it turns activity data into answers backed by evidence, and sends smart nudges that steer people off bad websites.</p> <a class="act" href="https://crawft.ai">crawft.ai ↗</a></article>
        <article class="card"><p class="kicker">cybersecurity</p><h3>Vurn AI</h3><p>A fully autonomous AI pentesting tool. 24 hours after I built it, it found a major vulnerability in a top-200 GitHub repo that gave access to over 40,000 Shopify accounts.</p></article>
        <article class="card"><p class="kicker">founder</p><h3>SiteLight</h3><p>A personal challenge: go from nothing to revenue in under two weeks. I made it in 10 days. It checks whether AI assistants recommend your business when someone asks, then hands you the to-do list to become the answer.</p> <a class="act" href="https://sitelight.xyz">sitelight.xyz ↗</a></article>
        <article class="card"><p class="kicker">voice AI</p><h3>Lily</h3><p>Calls my grandma every morning, has an actual conversation, then texts the family how she sounded.</p> <a class="act" href="https://lily.insforge.site">Live ↗</a> <a class="act" href="https://github.com/henrybrewer00-dotcom/lily">Repo ↗</a></article>
        <article class="card"><p class="kicker">hackathons</p><h3>Some hackathon wins</h3><p>InsForge · Frontier Tower · a16z × Cursor</p></article>
        <article class="card"><p class="kicker">open source</p><h3>Glasscast</h3><p>Screen Studio costs money, so I made a free one. Cinematic zooms, auto-captions, a webcam bubble, bring your own AI keys.</p> <a class="act" href="https://github.com/henrybrewer00-dotcom/Glasscast">Repo ↗</a></article>
        <article class="card"><p class="kicker">voice AI</p><h3>Lily's Drive-Thru</h3><p>Order out loud. The AI takes it, upsells you once, reads the total back with tax, and fires a live ticket to the kitchen screen.</p> <a class="act" href="https://github.com/henrybrewer00-dotcom/voice-drive-thru">Repo ↗</a></article>
        <article class="card"><p class="kicker">AI + audio</p><h3>Eleven Mile</h3><p>Pick two people and a topic and watch them rap-battle. Claude writes the bars, ElevenLabs raps them. A little dumb and I love it.</p> <a class="act" href="https://github.com/henrybrewer00-dotcom/eleven-mile">Repo ↗</a></article>
        <article class="card"><p class="kicker">accessibility</p><h3>PawBot</h3><p>Helps older people use a computer one step at a time, like helping your grandparent figure out their email.</p> <a class="act" href="https://github.com/henrybrewer00-dotcom/PawBot">Repo ↗</a></article>
        <article class="card"><p class="kicker">robotics</p><h3>S.I.E.G.E.</h3><p>A self-driving car that chases my dogs around while I'm busy. Sensors, steering logic, a lot of calibration, and wiring that looks worse than it works.</p></article>
        <article class="card"><p class="kicker">hardware · building now</p><h3>ROV Submarine</h3><p>A remote-controlled sub that has to survive real water. Most of the work is the unglamorous part: watertight, buoyant, and a battery that behaves.</p></article>
        <article class="card"><p class="kicker">merged pull requests</p><h3>Open source</h3><p>Real, merged pull requests to tools I use: SymPy, Biome, Astro. Small fixes, shipped, and people actually run them.</p> <a class="act" href="https://github.com/search?q=is%3Apr+author%3Ahenrybrewer00-dotcom+is%3Amerged&amp;type=pullrequests">See the PRs ↗</a></article>
        <article class="card"><p class="kicker">made with</p><h3>The stack</h3><p>React · TypeScript · Python · Electron · Arduino · Twilio · ElevenLabs · Claude · Vercel · GitHub</p></article>
