name: Deploy book availability

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "book/**"
      - ".github/workflows/deploy-book-availability.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Log in to InsForge
        env:
          INSFORGE_EMAIL: ${{ secrets.INSFORGE_EMAIL }}
          INSFORGE_PASSWORD: ${{ secrets.INSFORGE_PASSWORD }}
        run: |
          if [ -z "$INSFORGE_EMAIL" ] || [ -z "$INSFORGE_PASSWORD" ]; then
            echo "Skipping deploy: add INSFORGE_EMAIL and INSFORGE_PASSWORD repo secrets."
            exit 0
          fi
          npx @insforge/cli@latest login --email --json

      - name: Link Henry book project
        if: env.INSFORGE_EMAIL != ''
        env:
          INSFORGE_EMAIL: ${{ secrets.INSFORGE_EMAIL }}
          INSFORGE_PASSWORD: ${{ secrets.INSFORGE_PASSWORD }}
        run: |
          [ -z "$INSFORGE_EMAIL" ] && exit 0
          npx @insforge/cli@latest link --api-url https://s4f5vebr.us-east.insforge.app --yes

      - name: Patch + deploy availability and book
        if: env.INSFORGE_EMAIL != ''
        env:
          INSFORGE_EMAIL: ${{ secrets.INSFORGE_EMAIL }}
          INSFORGE_PASSWORD: ${{ secrets.INSFORGE_PASSWORD }}
        run: |
          [ -z "$INSFORGE_EMAIL" ] && exit 0
          npx @insforge/cli@latest functions code availability > /tmp/availability.ts
          sed -i 's/2026-06-21/2026-07-10/g; s/2026-06-26/2026-07-31/g' /tmp/availability.ts
          npx @insforge/cli@latest functions deploy availability --file /tmp/availability.ts -y
          npx @insforge/cli@latest functions code book > /tmp/book.ts
          sed -i 's/2026-06-21/2026-07-10/g; s/2026-06-26/2026-07-31/g' /tmp/book.ts
          npx @insforge/cli@latest functions deploy book --file /tmp/book.ts -y
